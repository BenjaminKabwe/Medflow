<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:transparent}svg{display:block}</style>
</head>
<body>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="sheen" x1="512" y1="0" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0b3a66" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#sheen)"/>

  <!-- medical cross (white) -->
  <g filter="url(#soft)">
    <rect x="448" y="236" width="128" height="552" rx="48" fill="#ffffff"/>
    <rect x="236" y="448" width="552" height="128" rx="48" fill="#ffffff"/>
  </g>

  <!-- ECG pulse carved through the cross as negative space (background gradient) -->
  <path d="M 250 512
           L 430 512
           L 470 512
           L 500 512
           L 516 400
           L 540 636
           L 560 512
           L 596 512
           L 774 512"
        fill="none" stroke="url(#bg)" stroke-width="52"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
</body>
</html>
