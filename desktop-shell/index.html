<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MedFlow</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0f172a; color: #e2e8f0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .wrap { height: 100%; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 1.25rem; }
      .spinner { width: 42px; height: 42px; border: 4px solid #1e293b;
        border-top-color: #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .brand { font-size: 1.4rem; font-weight: 600; letter-spacing: 0.02em; }
      .muted { font-size: 0.85rem; color: #64748b; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="spinner"></div>
      <div class="brand">MedFlow</div>
      <div class="muted">Chargement de l'application…</div>
    </div>
  </body>
</html>
